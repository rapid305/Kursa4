version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kursa4_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kursa4_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kursa4_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kursa4_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kursa4_db
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:80", "http://localhost"]'
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/backend
    command: sh -c "python scripts/init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - kursa4_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kursa4_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kursa4_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  kursa4_network:
    driver: bridge
